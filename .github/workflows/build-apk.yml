name: Build N-R-AI Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK (llama.cpp)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout N-R-AI
        uses: actions/checkout@v4

      - name: Checkout official llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: master
          path: llama.cpp

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Build APK
        working-directory: llama.cpp/examples/llama.android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p output
          cp llama.cpp/examples/llama.android/app/build/outputs/apk/debug/app-debug.apk output/N-R-AI-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: N-R-AI-Android-APK
          path: output/N-R-AI-debug.apk
          if-no-files-found: error
          retention-days: 14
